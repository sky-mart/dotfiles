- hosts: all
  pre_tasks:
    - name: Load vault variables
      include_vars:
        file: desktop_vault.yml
      when: (use_vault | default(false)) | bool

  roles:
    - dev
    - shell
    - role: desktop_notes
      when: (use_vault | default(false)) | bool
    - emacs
    - desktop_configs

  tasks:
    - name: Setup notes and docs backups
      include_role:
        name: backups
      when:
        - (use_vault | default(false)) | bool
        - (home_pc | default(false)) | bool
