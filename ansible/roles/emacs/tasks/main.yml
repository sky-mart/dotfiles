- name: Check emacs commit hash
  ansible.builtin.shell: |
    emacs --version 2>/dev/null | awk 'NR==2 {print $3}' || true
  register: emacs_version
  changed_when: false
  failed_when: false

- name: Set emacs commit
  ansible.builtin.set_fact:
    installed_emacs_commit: "{{ emacs_version.stdout | default('') }}"

- name: Install emacs
  block:
    - name: Remove emacs package
      ansible.builtin.apt:
        name: emacs
        state: absent

    - name: Create src directory
      ansible.builtin.file:
        path: ~/src
        state: directory
        mode: "0755"

    - name: Clone tree-sitter repo
      ansible.builtin.git:
        repo: "https://github.com/tree-sitter/tree-sitter.git"
        dest: ~/src/tree-sitter
        depth: 1

    - name: Build tree-sitter
      ansible.builtin.command: make
      args:
        chdir: ~/src/tree-sitter

    - name: Install tree-sitter
      ansible.builtin.command: make install PREFIX=/usr
      args:
        chdir: "{{ ansible_env.HOME }}/src/tree-sitter"
      become: true

    - name: Clone emacs repo
      ansible.builtin.git:
        repo: "https://git.savannah.gnu.org/git/emacs.git"
        dest: ~/src/emacs
        version: "{{ expected_emacs_commit }}"
        depth: 1

    - name: Install emacs deps
      ansible.builtin.apt:
        pkg: emacs
        update_cache: true
        state: build-dep
      become: true

    - name: Build emacs
      ansible.builtin.shell: |
        ./autogen.sh
        ./configure --with-tree-sitter --with-native-compilation=aot --with-pgtk --prefix=/usr
        make -j$(nproc)
      args:
        chdir: ~/src/emacs

    - name: Install emacs files
      ansible.builtin.command: make install
      args:
        chdir: "{{ ansible_env.HOME }}/src/emacs"
      become: true
  when: installed_emacs_commit != expected_emacs_commit

- name: Install emacs config
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/link_or_copy.yml"
  vars:
    cp_src: init.el
    cp_dest: ~/.emacs.d/init.el

- name: Create the user systemd directory
  ansible.builtin.file:
    path: ~/.config/systemd/user
    state: directory
    mode: "0755"

- name: Copy emacs systemd user file
  ansible.builtin.copy:
    src: emacs.service
    dest: "~/.config/systemd/user/emacs.service"

- name: Remove obsolete Plasma-specific Emacs enablement
  ansible.builtin.file:
    path: ~/.config/systemd/user/plasma-workspace.target.wants/emacs.service
    state: absent

- name: Enable emacs systemd service for user login
  ansible.builtin.systemd:
    name: emacs.service
    scope: user
    enabled: true
    daemon_reload: true
    force: true
