separator_block_width=24

[music]
command=playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo "no music"
interval=5

[bluetooth]
command=dev=$(bluetoothctl devices Connected 2>/dev/null | cut -d' ' -f3-); echo "BT ${dev:-none}"
interval=10

[wifi]
command=ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2}'); echo "WIFI ${ssid:-none}"
interval=10

[volume]
command=m=$(pactl get-sink-mute @DEFAULT_SINK@); case "$m" in *yes*) echo "VOL mute";; *) pactl get-sink-volume @DEFAULT_SINK@ | awk 'NR==1{print "VOL " $5}';; esac
interval=5

[keyboard]
command=~/.local/bin/kb-layout.sh | tr '[:lower:]' '[:upper:]'
interval=1

[date]
command=date '+%Y-%m-%d %H:%M:%S'
interval=5
