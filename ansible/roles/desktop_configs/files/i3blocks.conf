separator_block_width=24

[music]
command=playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo "no music"
interval=5

[weather]
command=~/.local/bin/i3blocks-weather.sh
interval=1800

[bluetooth]
command=~/.local/bin/i3blocks-bluetooth.sh
markup=pango
interval=10

[wifi]
command=ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2}'); [ -n "$ssid" ] && echo "<span size='large'></span> ${ssid}"
markup=pango
interval=10

[netspeed]
command=~/.local/bin/i3blocks-netspeed.sh
markup=pango
interval=2

[volume]
command=~/.local/bin/i3blocks-volume.sh
markup=pango
interval=1

[keyboard]
command=~/.local/bin/kb-layout.sh | tr '[:lower:]' '[:upper:]'
interval=1

[battery]
command=~/.local/bin/i3blocks-battery.sh
markup=pango
interval=15

[date]
command=~/.local/bin/i3blocks-date.sh
interval=1
