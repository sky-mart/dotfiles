separator_block_width=24

[music]
command=playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo "no music"
interval=5

[bluetooth]
command=~/.local/bin/i3blocks-bluetooth.sh
markup=pango
interval=10

[wifi]
command=ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2}'); [ -n "$ssid" ] && echo "<span size='large'></span> ${ssid}"
markup=pango
interval=10

[volume]
command=~/.local/bin/i3blocks-volume.sh
markup=pango
interval=1

[keyboard]
command=~/.local/bin/kb-layout.sh | tr '[:lower:]' '[:upper:]'
interval=1

[date]
command=date '+%Y-%m-%d %H:%M:%S'
interval=5
