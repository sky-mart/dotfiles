# Requires a truecolor terminal with COLORTERM=truecolor or COLORTERM=24bit.

[skin]
    description = Nord Dark
    truecolors = true

[aliases]
    nord0 = #2e3440
    nord1 = #3b4252
    nord2 = #434c5e
    nord3 = #4c566a
    nord4 = #d8dee9
    nord5 = #e5e9f0
    nord6 = #eceff4
    nord7 = #8fbcbb
    nord8 = #88c0d0
    nord9 = #81a1c1
    nord10 = #5e81ac
    nord11 = #bf616a
    nord12 = #d08770
    nord13 = #ebcb8b
    nord14 = #a3be8c
    nord15 = #b48ead

[core]
    _default_ = nord4;nord0
    selected = nord6;nord2
    marked = nord13;;bold
    markselect = nord13;nord2;bold
    gauge = nord0;nord8
    input = nord6;nord1
    inputunchanged = nord4;nord1
    inputmark = nord0;nord8
    commandlinemark = nord0;nord8
    reverse = nord0;nord8
    header = nord8
    disabled = nord3;nord1
    shadow = nord0;nord1

[dialog]
    _default_ = nord4;nord1
    dfocus = nord6;nord3
    dhotnormal = nord8
    dhotfocus = nord8;nord3
    dtitle = nord8;;bold

[error]
    _default_ = nord6;nord11
    errdfocus = nord0;nord13
    errdhotnormal = nord13
    errdhotfocus = nord0;nord13;bold
    errdtitle = nord6;;bold

[filehighlight]
    directory = nord8;;bold
    executable = nord14
    symlink = nord7
    hardlink = nord7
    stalelink = nord11
    device = nord15
    special = nord12
    core = nord11
    temp = nord3
    archive = nord12
    doc = nord5
    source = nord9
    media = nord15
    graph = nord13
    database = nord7

[menu]
    _default_ = nord4;nord1
    menusel = nord0;nord8
    menuhot = nord8
    menuhotsel = nord0;nord8;bold
    menuinactive = nord3

[popupmenu]
    _default_ = nord4;nord1
    menusel = nord0;nord8
    menutitle = nord8;;bold

[buttonbar]
    hotkey = nord0;nord8
    button = nord4;nord2

[statusbar]
    _default_ = nord4;nord2

[help]
    _default_ = nord4;nord0
    helpitalic = nord14;;italic
    helpbold = nord8;;bold
    helplink = nord9;;underline
    helpslink = nord0;nord8
    helptitle = nord8;;bold

[editor]
    _default_ = nord4;nord0
    editbold = nord13;;bold
    editmarked = nord6;nord2
    editwhitespace = nord3;nord0
    editnonprintable = nord11;nord0
    editlinestate = nord3;nord1
    bookmark = nord4;nord2
    bookmarkfound = nord0;nord8
    editrightmargin = ;nord1
    editbg = ;nord0
    editframe = nord3
    editframeactive = nord8
    editframedrag = nord13

[viewer]
    _default_ = nord4;nord0
    viewbold = nord8;;bold
    viewunderline = nord9;;underline
    viewselected = nord6;nord2

[diffviewer]
    added = nord14;nord0
    changedline = nord4;nord1
    changednew = nord0;nord14
    changed = nord0;nord13
    removed = nord11;nord0
    error = nord6;nord11
