# default prefix
bind-key C-b send-prefix

# better split shortcuts
bind h split-window -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
unbind '"'
unbind %
bind -n C-F6 split-window -h -c '#{pane_current_path}'
bind -n C-F5 split-window -v -c '#{pane_current_path}'

# window and pane number from 1
set -g base-index 1
setw -g pane-base-index 1

# use mouse
set -g mouse on

# forward inner (e.g. remote) tmux's OSC 52 clipboard sequences out to the terminal
set -g set-clipboard on

# reload config file
bind r source-file ~/.config/tmux/tmux.conf

# popular cyrillic shortcuts
bind-key C-и send-prefix
bind р split-window -h -c '#{pane_current_path}'
bind м split-window -v -c '#{pane_current_path}'
bind к source-file ~/.config/tmux/tmux.conf
bind с new-window -c '#{pane_current_path}'
bind ч kill-pane
bind м split-window -v -c '#{pane_current_path}'
bind щ select-pane -t :.+
