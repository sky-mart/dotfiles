bar {
    position bottom
    output primary
    status_command i3blocks -c ~/.config/i3blocks/config
    font pango:FiraCode Nerd Font Mono 11
    colors {
        statusline #2e3440
        background #eceff4
        focused_workspace #5e81ac #5e81ac #eceff4
        active_workspace #e5e9f0 #e5e9f0 #2e3440
        inactive_workspace #eceff4 #eceff4 #2e3440
        urgent_workspace #bf616a #bf616a #eceff4
    }
}
