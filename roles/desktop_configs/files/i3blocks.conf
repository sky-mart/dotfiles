separator_block_width=24

[music]
command=~/.local/bin/i3blocks-music.sh
interval=5

[weather]
command=~/.local/bin/i3blocks-weather.sh
interval=1800

[bluetooth]
command=~/.local/bin/i3blocks-bluetooth.sh
markup=pango
interval=10

[wifi]
command=~/.local/bin/i3blocks-wifi.sh
markup=pango
interval=10
signal=10

[netspeed]
command=~/.local/bin/i3blocks-netspeed.sh
markup=pango
interval=2
signal=10

[keyboard]
command=~/.local/bin/i3blocks-keyboard.sh
interval=1

[volume]
command=~/.local/bin/i3blocks-volume.sh
markup=pango
interval=1

[brightness]
command=~/.local/bin/i3blocks-brightness.sh
markup=pango
interval=1

[battery]
command=~/.local/bin/i3blocks-battery.sh
markup=pango
interval=15

[date]
command=~/.local/bin/i3blocks-date.sh
interval=1

[power]
command=~/.local/bin/i3blocks-power.sh
markup=pango
interval=60
