bar {
    position bottom
    output primary
    status_command i3blocks -c ~/.config/i3blocks/config
    font pango:FiraCode Nerd Font Mono 11
    colors {
        statusline #d8dee9
        background #2e3440
        focused_workspace #88c0d0 #88c0d0 #2e3440
        active_workspace #3b4252 #3b4252 #d8dee9
        inactive_workspace #2e3440 #2e3440 #d8dee9
        urgent_workspace #bf616a #bf616a #2e3440
    }
}
