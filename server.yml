- hosts: all
  pre_tasks:
    - name: Load vault variables
      include_vars:
        file: server_vault.yml
      when: (use_vault | default(false)) | bool

  roles:
    - shell
    - role: basic_firewall
      become: true
    - docker
    - role: ftp_server
      become: true
      when: (use_vault | default(false)) | bool
    - role: dav_server
      when: (use_vault | default(false)) | bool
